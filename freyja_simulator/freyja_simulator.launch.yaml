launch:
- arg: { name: "team_namespace",      default: "" } 
- arg: { name: "start_rviz",          default: "true" }
- arg: { name: "robot_num_range",     default: "[101, 105]" }
- arg: { name: "robot_type",          default: "aerial" }
- node:
    pkg:  "tf2_ros"
    exec: "static_transform_publisher"
    args: "0 0 0 1.57 0.0 3.14 map map_ned"

- node:
    if:   "$(var start_rviz)"
    pkg:    "rviz2"
    exec:   "rviz2"

- group:
  - push-ros-namespace:
      namespace: "$(var team_namespace)"
  - node:
      pkg:        "freyja_simulator"
      exec:       "freyja_simulator_node"
      output:     "screen"
      param:
      - { name: "platf_basename",       value: "R" }                # robot name prefix, "R", "cf" etc
      - { name: "robot_num_range",      value:  "$(var robot_num_range)" } # [i,j], robots named [{prefix}i..{prefix}j]
      - { name: "robot_type",           value:  "$(var robot_type)" }  # 'holo2d' 'diffdrive' 'aerial'
      - { name: "autoarmed",            value:  true }              # robots armed already
      - { name: "init_positions",       value:  [-2.0, 2.0, -1.5,
                                               -1.0, 1.0, -1.5] }   # [pn,pe,pd]*N, 3*N sized array; remaining robots init randomly
      - { name: "team_color",           value:  [0.7, 0.0, 0.0] }   # marker color, rgb
      - { name: "team_id",              value:  0 }                 # common id for these robots
      - { name: "sim_rate",             value:  150.0 }             # main sim rate, robot sim at (fixed) high rate
      - { name: "topic_rate",           value:  120.0 }             # topics updated at this rate
      - { name: "enable_collisions",    value:  false }             # naive quadratic collision handling
      - { name: "obst_pos_list",        value:  [0.0, 0.0] }        # [pn,pe]*M
      - { name: "publish_gt_curstate",  value:  false }             # publish "current_state_gt" topic (note: we have tf already)
      - { name: "enable_downwash",      value:  false }             # apply ellipsoidal downwash
      - { name: "dwash_ellipse_a",      value:  0.3 }               # ellipse-a [metres] for applying downwash             
      - { name: "dwash_expo_ampl",      value:  5.0 }               # amplitude for exponential downwash; A*exp(..)
