launch:
- arg: { name: "team_namespace",      default: "" } 
- arg: { name: "start_rviz",          default: "true" }

- node:
    pkg:  "tf2_ros"
    exec: "static_transform_publisher"
    args: "0 0 0 1.57 0.0 3.14 map map_ned"

- node:
    if:   "$(var start_rviz)"
    pkg:    "rviz2"
    exec:   "rviz2"

- group:
  - push-ros-namespace:
      namespace: "$(var team_namespace)"
  - node:
      pkg:        "freyja_simulator"
      exec:       "freyja_simulator_node"
      output:     "screen"
      param:
      - { name:   "robot_num_range",    value:  [1, 2] }              # [i,j] robots numbered [Ui..Uj]
      - { name:   "init_positions",     value:  [-2.0, 2.0, -1.5,
                                                 -1.0, 1.0, -1.5] }   # [pn,pe,pd]*N, 3*N sized array
      - { name:   "team_color",         value:  [0.7, 0.0, 0.0] }     # marker color, rgb
      - { name:   "team_id",            value:  0 }                   # common id for these robots
      - { name:   "sim_rate",           value:  150.0 }               # main sim rate, robot sim at (fixed) high rate
      - { name:   "topic_rate",         value:  120.0 }               # topics updated at this rate
      - { name:   "enable_collisions",  value:  false }               # naive quadratic collision handling
      - { name:   "robots_type",        value:  "holonomic" }         # holonomic or diffdrive
      - { name:   "obst_pos_list",      value:  [0.0, 0.0] }          # [pn,pe]*M
      - { name:   "enable_downwash",    value:  false }                # apply ellipsoidal downwash
